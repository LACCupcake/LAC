<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>LAC Teams – Intro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; background: #000; overflow: hidden; }
  body { font-family: "Inter Display", "Inter", system-ui, sans-serif; color: #f5f5f7; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: #000; }

  .orb { position: absolute; border-radius: 50%; filter: blur(140px); }
  #orb1 { width: 900px; height: 900px; background: radial-gradient(circle, #5b3cc4 0%, transparent 70%); }
  #orb2 { width: 800px; height: 800px; background: radial-gradient(circle, #2d4bd6 0%, transparent 70%); }
  #orb3 { width: 700px; height: 700px; background: radial-gradient(circle, #b23a8a 0%, transparent 70%); }
  #grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .05; mix-blend-mode: overlay; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.85) 100%); }

  /* everything below is positioned relative to the screen centre */
  #lockup, #headline, #teams { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }

  #logo { position: absolute; width: 460px; height: 416px; left: -230px; top: -208px; }
  #logo svg { width: 100%; height: 100%; overflow: visible; }
  #divider { position: absolute; left: -200px; top: -170px; width: 2px; height: 340px; transform-origin: center;
             background: linear-gradient(transparent, rgba(255,255,255,.85) 20%, rgba(255,255,255,.85) 80%, transparent); }
  #wordmark { position: absolute; left: -100px; top: -46px; white-space: nowrap; font-size: 92px; line-height: 1; }
  #wordmark .lac { font-weight: 200; }
  #wordmark .teams { font-weight: 700; }
  .ch, .word { display: inline-block; }

  #headline { }
  #headline .inner { position: absolute; left: -900px; width: 1800px; top: -50px; text-align: center; font-size: 96px; font-weight: 700; letter-spacing: -.03em; line-height: 1; transform-origin: center; }
  #headline .word { padding: 0 .11em; }
  .grad-brand { background: linear-gradient(90deg, #a78bfa, #818cf8 40%, #f0abfc 70%, #a78bfa); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }

  #teams .row { position: absolute; left: -900px; width: 1800px; top: -80px; display: flex; justify-content: center; align-items: center; }
  .tname { font-size: 150px; font-weight: 800; letter-spacing: -.045em; line-height: 1; padding: 0 20px 24px;
           background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sep { width: 2px; height: 110px; margin: 0 46px 18px; background: linear-gradient(transparent, rgba(255,255,255,.45), transparent); transform-origin: center; }
  #nPrime   { background-image: linear-gradient(100deg, #ffffff 0%, #c4b5fd 30%, #ffffff 50%, #a78bfa 75%, #ffffff 100%); }
  #nAcademy { background-image: linear-gradient(100deg, #93c5fd 0%, #818cf8 30%, #e0e7ff 50%, #60a5fa 75%, #93c5fd 100%); }
  #nSpark   { background-image: linear-gradient(100deg, #fda4af 0%, #f0abfc 30%, #fff1f2 50%, #fb923c 75%, #f472b6 100%); }

  #fade { position: absolute; inset: 0; background: #000; }
</style>
</head>
<body>
<div id="stage">
  <div class="orb" id="orb1"></div>
  <div class="orb" id="orb2"></div>
  <div class="orb" id="orb3"></div>

  <div id="lockup">
    <div id="divider"></div>
    <div id="logo">
      <svg viewBox="23 72 625 566">
        <defs>
          <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fff" stop-opacity="0"/>
            <stop offset=".5" stop-color="#fff" stop-opacity=".9"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="snakeGrad" gradientUnits="userSpaceOnUse" x1="1700" y1="300" x2="100" y2="600">
            <stop offset="0" stop-color="#c4b5fd"/>
            <stop offset=".55" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#ffffff"/>
          </linearGradient>
          <clipPath id="logoClip"><path id="clipShape"/></clipPath>
        </defs>
        <g id="snakeG" fill="none" stroke="url(#snakeGrad)" stroke-linecap="round" stroke-linejoin="round">
          <path id="snake"/>
          <path id="branchC"/>
          <path id="branchFoot"/>
        </g>
        <path id="sharp" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
        <g clip-path="url(#logoClip)"><rect id="shineRect" y="40" width="240" height="640" fill="url(#shine)" transform="skewX(-20)"/></g>
      </svg>
    </div>
    <div id="wordmark"><span class="lac"></span>&nbsp;<span class="teams"></span></div>
  </div>

  <div id="headline"><div class="inner"></div></div>

  <div id="teams"><div class="row">
    <div class="tname" id="nPrime">Prime</div><div class="sep"></div>
    <div class="tname" id="nAcademy">Academy</div><div class="sep"></div>
    <div class="tname" id="nSpark">Spark</div>
  </div></div>

  <canvas id="grain" width="480" height="270"></canvas>
  <div id="vignette"></div>
  <div id="fade"></div>
</div>

<script>
const DURATION = 12;

// --- logo geometry (viewBox units) ---------------------------------------
// exact brand outline, used once the line has settled
const LOGO_D = "M340,82 L497,362 L435,362 L340,193 L128,570 L209,570 L340,336 L386,418 L520,418 L571,509 L515,509 L494,472 L416,472 L471,570 L605,570 L638,628 L443,628 L340,445 L270,570 L332,570 L365,628 L33,628 Z";
// centre-line of the logo strokes, drawn with round caps/joins
const LEAD = "M1750,260 C1520,260 1480,720 1260,720 C1040,720 1010,430 850,430 C700,430 690,599 593,599";
const MAIN = "L457.1,599 L340,390.5 L222.9,599 L81,599 L340,137.5 L450.4,334";
const BRANCH_C = "M370.6,445 L507,445 L527.8,482";
const BRANCH_FOOT = "M222.9,599 L320,599";
const STROKE_FULL = 57;

// --- easing ------------------------------------------------------------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t;
  const dx = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 10; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-7 || !d) break; t -= e / d; }
    return sy(clamp(t));
  };
}
const ease = {
  smooth: bezier(0.45, 0, 0.15, 1),    // Apple-ish in/out with long soft landing
  out: bezier(0.16, 1, 0.3, 1),
  inOut: bezier(0.65, 0, 0.35, 1),
  snake: bezier(0.5, 0.05, 0.2, 1),
};
const p = (t, start, dur, e = ease.out) => e(clamp((t - start) / dur));

// --- DOM ---------------------------------------------------------------
const $ = s => document.querySelector(s);
const snake = $('#snake'), brC = $('#branchC'), brF = $('#branchFoot'), sharp = $('#sharp');
snake.setAttribute('d', LEAD + MAIN);
brC.setAttribute('d', BRANCH_C); brF.setAttribute('d', BRANCH_FOOT);
sharp.setAttribute('d', LOGO_D); $('#clipShape').setAttribute('d', LOGO_D);

// measure lengths
const tmp = document.createElementNS('http://www.w3.org/2000/svg', 'path');
tmp.setAttribute('d', LEAD); $('#snakeG').appendChild(tmp);
const leadLen = tmp.getTotalLength(); tmp.remove();
const totalLen = snake.getTotalLength();
const cLen = brC.getTotalLength(), fLen = brF.getTotalLength();
// distance along the snake at which each branch sprouts
function distTo(x, y) {
  let best = 0, bd = 1e9;
  for (let s = leadLen; s <= totalLen; s += 1) { const q = snake.getPointAtLength(s); const d = Math.hypot(q.x - x, q.y - y); if (d < bd) { bd = d; best = s; } }
  return best;
}
const jC = distTo(370.6, 445), jF = distTo(222.9, 599);

const split = (el, text) => [...text].map(c => { const s = document.createElement('span'); s.className = 'ch'; s.textContent = c; el.appendChild(s); return s; });
const wmChars = [...split($('#wordmark .lac'), 'LAC'), ...split($('#wordmark .teams'), 'TEAMS')];
const hlWords = 'Drei|Teams|in|der|<span class="grad-brand">Prime&nbsp;League.</span>'.split('|').map(w => {
  const s = document.createElement('span'); s.className = 'word'; s.innerHTML = w; $('#headline .inner').appendChild(s); return s;
});
const names = ['#nPrime', '#nAcademy', '#nSpark'].map($);
const seps = [...document.querySelectorAll('.sep')];

const g = $('#grain').getContext('2d'), gImg = g.createImageData(480, 270);
function grain(seed) {
  let s = seed * 9301 + 49297;
  for (let i = 0; i < gImg.data.length; i += 4) { s = (s * 16807) % 2147483647; gImg.data[i] = gImg.data[i + 1] = gImg.data[i + 2] = s & 255; gImg.data[i + 3] = 255; }
  g.putImageData(gImg, 0, 0);
}

function fx(el, { o = 1, x = 0, y = 0, s = 1, blur = 0 } = {}) {
  el.style.opacity = o;
  el.style.transform = `translate3d(${x}px,${y}px,0) scale(${s})`;
  el.style.filter = blur > 0.05 ? `blur(${blur}px)` : 'none';
}

// --- timeline ------------------------------------------------------------
// 0.0 – 2.9  line slithers in and lays itself into the logo, then swells
// 2.9 – 4.2  logo glides left, "LAC TEAMS" assembles beside it
// 4.6 – 5.6  lockup rises to the top, headline appears in the freed space
// 6.6 – 7.6  headline lifts, the three team names rise beneath it
// 7.6 – 11   hold with light sweeps; 11 – 12 fade out
window.render = function (t) {
  grain(Math.floor(t * 24));

  // ambient light
  const amb = 0.3 + 0.5 * p(t, 0, 2.5, ease.smooth);
  const [o1, o2, o3] = ['#orb1', '#orb2', '#orb3'].map($);
  o1.style.transform = `translate(${-200 + Math.sin(t * .45) * 160}px, ${-250 + Math.cos(t * .35) * 120}px)`;
  o2.style.transform = `translate(${1250 + Math.cos(t * .4) * 180}px, ${400 + Math.sin(t * .3) * 140}px)`;
  o3.style.transform = `translate(${600 + Math.sin(t * .33 + 2) * 260}px, ${650 + Math.cos(t * .41) * 90}px)`;
  o1.style.opacity = amb; o2.style.opacity = amb * .8; o3.style.opacity = amb * .55;

  // ---- snake ----
  const draw = p(t, 0.15, 2.05, ease.snake);
  const head = draw * totalLen;
  const body = 900;                                   // visible length while travelling
  const tail = clamp(head - body, 0, leadLen);       // tail stops where the logo starts
  const swell = p(t, 1.95, 0.75, ease.smooth);
  const width = lerp(14, STROKE_FULL, swell);
  snake.style.strokeWidth = width;
  snake.style.strokeDasharray = `0 ${tail} ${Math.max(0.001, head - tail)} ${totalLen * 2}`;
  [[brC, jC, cLen], [brF, jF, fLen]].forEach(([el, j, len]) => {
    const l = clamp(head - j, 0, len);
    el.style.strokeWidth = width;
    el.style.strokeDasharray = `${Math.max(0.001, l)} ${len * 2}`;
    el.style.opacity = l > 0.5 ? 1 : 0;
  });
  // rounded line → exact brand mark, hidden under a light sweep
  const settle = p(t, 2.55, 0.45, ease.smooth);
  sharp.style.opacity = settle;
  $('#snakeG').style.opacity = 1 - p(t, 2.75, 0.3, ease.smooth);
  const sh = p(t, 2.4, 1.0, ease.inOut);
  const sh2 = p(t, 8.3, 1.1, ease.inOut);
  const sr = $('#shineRect');
  const shv = t < 6 ? sh : sh2;
  sr.setAttribute('x', lerp(-350, 950, shv));
  sr.style.opacity = shv > 0 && shv < 1 ? 1 : 0;

  // ---- lockup ----
  const slide = p(t, 2.9, 1.3, ease.smooth);
  const rise = p(t, 4.6, 1.2, ease.smooth);
  const intro = p(t, 0.15, 3.0, ease.out);
  const logo = $('#logo');
  const glow = 0.45 * swell;
  fx(logo, { x: lerp(0, -560, slide), s: lerp(1.12, 1, intro) * lerp(1.0, 0.92, slide) });
  logo.style.filter = `drop-shadow(0 0 ${36 + 18 * Math.sin(t * 1.6) ** 2}px rgba(139,92,246,${glow}))`;

  const dv = p(t, 3.25, 0.9, ease.out);
  $('#divider').style.opacity = dv;
  $('#divider').style.transform = `scaleY(${dv})`;
  $('#wordmark').style.letterSpacing = `${lerp(.55, .32, p(t, 3.2, 1.4, ease.out))}em`;
  wmChars.forEach((c, i) => {
    const a = p(t, 3.2 + i * 0.045, 0.8);
    fx(c, { o: a, x: (1 - a) * 26, blur: (1 - a) * 12 });
  });
  const L = $('#lockup');
  L.style.transform = `translate(${lerp(0, 45, slide)}px, ${lerp(0, -200, rise)}px) scale(${lerp(1, 0.5, rise)})`;

  // ---- headline ----
  const lift = p(t, 6.6, 1.1, ease.smooth);
  hlWords.forEach((w, i) => {
    const a = p(t, 5.2 + i * 0.09, 0.9);
    fx(w, { o: a, y: (1 - a) * 44, blur: (1 - a) * 18 });
  });
  const hi = $('#headline .inner');
  hi.style.transform = `translateY(${lerp(60, -20, lift)}px) scale(${lerp(1, 0.6, lift)})`;
  hi.style.color = `rgba(245,245,247,${lerp(1, 0.78, lift)})`;
  document.querySelectorAll('.grad-brand').forEach(el => el.style.backgroundPosition = `${lerp(100, 0, p(t, 5.3, 4.5, ease.smooth))}% 0`);

  // ---- team names ----
  names.forEach((n, i) => {
    const a = p(t, 6.85 + i * 0.12, 1.05);
    fx(n, { o: a, y: (1 - a) * 70 + 170, s: lerp(1.06, 1, a), blur: (1 - a) * 22 });
    n.style.backgroundPosition = `${lerp(100, 0, p(t, 7.0 + i * 0.12, 3.4, ease.smooth))}% 0`;
  });
  seps.forEach((s, i) => {
    const a = p(t, 7.25 + i * 0.1, 0.8);
    s.style.opacity = a; s.style.transform = `translateY(170px) scaleY(${a})`;
  });

  // ---- global ----
  const out = p(t, 10.9, 1.0, ease.inOut);
  $('#stage').style.transform = `scale(${lerp(1, 0.985, out)})`;
  $('#fade').style.opacity = (1 - p(t, 0, 0.5, ease.smooth)) + out;
};

window.DURATION = DURATION;
if (!location.search.includes('capture')) {
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
